name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: pg }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race ./...
        env:
          MODELGATE_TEST_POSTGRES_DSN: postgres://postgres:pg@localhost:5432/postgres?sslmode=disable
      - name: vulnerability scan (Go dependencies)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: envtest (real kube-apiserver)
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.21
          KUBEBUILDER_ASSETS="$(setup-envtest use 1.33.0 -p path)" go test ./internal/controller/ ./internal/webhook/ -run "Envtest|Webhook" -v
      - run: go run ./hack/loadtest -rps 1000 -duration 20s
      - name: generated code is up to date
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.18.0
          make generate manifests
          git diff --exit-code
      - uses: azure/setup-helm@v4
      - run: helm lint charts/modelgate
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r demo/model/requirements.txt
      - run: make smoke
      - run: make bench
