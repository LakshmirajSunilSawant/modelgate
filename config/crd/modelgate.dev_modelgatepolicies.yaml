---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: modelgatepolicies.modelgate.dev
spec:
  group: modelgate.dev
  names:
    kind: ModelGatePolicy
    listKind: ModelGatePolicyList
    plural: modelgatepolicies
    shortNames:
    - mgp
    singular: modelgatepolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelGatePolicy sets namespace-wide quality-gate defaults that teams can
          only tighten.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelGatePolicySpec is the floor every ModelRollout in the namespace must
              meet. Rollouts may be stricter, never looser. The controller enforces it
              at runtime by merging it into each rollout, and the validating webhook
              rejects rollouts that ask for less.
            properties:
              checks:
                description: |-
                  Checks every rollout gets. A rollout check of the same type covering
                  the same phase may set a stricter threshold; a missing one is added.
                items:
                  description: CheckSpec configures one quality check.
                  properties:
                    max:
                      type: number
                    min:
                      type: number
                    name:
                      type: string
                    phase:
                      description: Restrict the check to one phase. Empty means both.
                      enum:
                      - shadow
                      - canary
                      type: string
                    type:
                      enum:
                      - agreementRate
                      - meanAbsDiff
                      - psi
                      - chiSquare
                      - ks
                      - wasserstein
                      - validity
                      - p99Ratio
                      - errorRate
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              maxAlpha:
                description: Rollouts may use at most this false-alarm budget per
                  check per stage.
                type: number
              maxFailureLimit:
                description: Rollouts may allow at most this many consecutive failed
                  evaluations.
                format: int32
                minimum: 1
                type: integer
              maxFirstStepWeight:
                description: The first canary step may send at most this share of
                  traffic.
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              minSamples:
                description: Rollouts must use at least this many samples before judging.
                format: int64
                minimum: 1
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: a namespace has one ModelGatePolicy, named default
          rule: self.metadata.name == 'default'
    served: true
    storage: true
