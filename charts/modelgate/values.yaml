image:
  registry: ghcr.io/modelgate
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent

controller:
  replicas: 2        # leader election keeps one active
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

analyzer:
  replicas: 1        # sketches live in memory; replay from NATS rebuilds them after a restart
  bucket: 15s
  retention: 3h
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# NATS JetStream URL. Leave empty to send events from sidecars to the
# analyzer over HTTP (fine for a local demo; no replay after analyzer restarts).
nats:
  url: ""

# PostgreSQL audit log of every verdict, step change, promotion, rollback,
# and manual action. Point it at a Secret holding a DSN such as
# postgres://user:pass@host:5432/modelgate?sslmode=require. When it is set and
# the database is unreachable, rollouts hold instead of advancing; rollbacks
# still happen. Leave existingSecret empty to record decisions in events only.
audit:
  existingSecret: ""
  secretKey: dsn

# Set to "true" to freeze every rollout in the cluster at its current weight.
killSwitch:
  freeze: "false"

# Validating webhook that rejects ModelRollouts looser than their namespace
# ModelGatePolicy. The controller enforces policies either way.
webhook:
  enabled: true
  failurePolicy: Ignore

# Grafana dashboard as a ConfigMap for the Grafana sidecar to load.
grafana:
  dashboard:
    enabled: true
    namespace: ""          # defaults to the release namespace
    label: grafana_dashboard
    labelValue: "1"
