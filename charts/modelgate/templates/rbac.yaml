apiVersion: v1
kind: ServiceAccount
metadata:
  name: modelgate-controller
  namespace: {{ .Release.Namespace }}
  labels: {{- include "modelgate.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modelgate-controller
  labels: {{- include "modelgate.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - modelgate.dev
  resources:
  - modelrollouts
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - modelgate.dev
  resources:
  - modelrollouts/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modelgate-controller
  labels: {{- include "modelgate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: modelgate-controller
subjects:
  - kind: ServiceAccount
    name: modelgate-controller
    namespace: {{ .Release.Namespace }}
