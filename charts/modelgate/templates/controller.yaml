apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelgate-controller
  namespace: {{ .Release.Namespace }}
  labels: {{- include "modelgate.labels" . | nindent 4 }}
    app.kubernetes.io/name: modelgate-controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: modelgate-controller }
  template:
    metadata:
      labels: { app.kubernetes.io/name: modelgate-controller }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: modelgate-controller
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: manager
          image: {{ .Values.image.registry }}/modelgate-controller:{{ include "modelgate.tag" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect=true
            - --analyzer-url={{ include "modelgate.analyzerURL" . }}
            - --sidecar-image={{ .Values.image.registry }}/modelgate-sidecar:{{ include "modelgate.tag" . }}
            - --kill-switch-namespace={{ .Release.Namespace }}
            - --kill-switch-configmap=modelgate-config
            {{- with .Values.nats.url }}
            - --nats-url={{ . }}
            {{- end }}
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: probes, containerPort: 8081 }
          livenessProbe: { httpGet: { path: /healthz, port: probes } }
          readinessProbe: { httpGet: { path: /readyz, port: probes } }
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
