# Minimal Prometheus and Grafana for a local kind demo, in namespace
# modelgate-system. Not for production: no persistence, anonymous Grafana
# admin. Prometheus scrapes the controller, analyzer and capture sidecars;
# Grafana loads the ModelGate dashboard from the Helm chart's ConfigMap.
#
#   kubectl apply -f hack/observability.yaml
#   kubectl -n modelgate-system port-forward svc/grafana 3000:3000
#   open http://localhost:3000/d/modelgate
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: modelgate-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: modelgate-demo-prometheus }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: modelgate-demo-prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: modelgate-demo-prometheus }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: modelgate-system }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: modelgate-system }
data:
  prometheus.yml: |
    global: { scrape_interval: 10s, evaluation_interval: 10s }
    scrape_configs:
      # Controller and analyzer pods carry prometheus.io/scrape annotations.
      - job_name: modelgate
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [modelgate-system] } }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # Capture sidecars in any namespace, found by their admin port name.
      - job_name: modelgate-sidecar
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: capture-admin
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: modelgate-system }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  template:
    metadata: { labels: { app.kubernetes.io/name: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=6h]
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: modelgate-system }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-provisioning, namespace: modelgate-system }
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus.modelgate-system.svc:9090
        isDefault: true
        jsonData: { timeInterval: 10s }
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: modelgate
        type: file
        options: { path: /var/lib/grafana/dashboards }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: modelgate-system }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: grafana } }
  template:
    metadata: { labels: { app.kubernetes.io/name: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/modelgate.json }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: http } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: dashboard, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: provisioning, configMap: { name: grafana-provisioning } }
        - { name: dashboard, configMap: { name: modelgate-dashboard } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: modelgate-system }
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
